services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medcy_hrms_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-9700}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
